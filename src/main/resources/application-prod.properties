# PRODUCTION DATABASE SETTINGS (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bioshield_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HIBERNATE SETTINGS
# 'update' automatically creates tables based on the JPA @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# SQL IMPORT
# We ran this once, so now we turn it off so it doesn't crash on restarts
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:import.sql
